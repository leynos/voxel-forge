<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VoxelForge Editor</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; color: #eee; }
      #canvas { display: block; width: 100vw; height: 100vh; }
      #hud {
        position: fixed; top: 12px; left: 12px; padding: 12px 16px;
        background: rgba(0,0,0,0.65); border-radius: 8px; font-size: 13px;
        max-width: 320px; line-height: 1.5;
      }
      #hud h1 { font-size: 16px; margin-bottom: 6px; color: #7fdbff; }
      #status { color: #aaa; font-size: 12px; margin-top: 8px; }
      #palette { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
      .swatch {
        width: 24px; height: 24px; border: 2px solid #555; border-radius: 4px;
        cursor: pointer;
      }
      .swatch.active { border-color: #fff; box-shadow: 0 0 6px #fff; }
    </style>
  </head>
  <body>
    <div id="hud">
      <h1>VoxelForge</h1>
      <div>Goxel-style voxel editor + MCP bridge</div>
      <div id="scene-info">Scene: —</div>
      <div id="palette"></div>
      <div id="status">Connecting…</div>
      <div style="margin-top:8px;font-size:11px;color:#888">
        Left click: place · Right click: remove · Middle drag: orbit · Scroll: zoom
      </div>
    </div>
    <canvas id="canvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
