[project]
name = "voxel-forge"
version = "0.1.0"
description = "Voxel editor inspired by Goxel with MCP bridge for AI assistants"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9.0,<2",
    "websockets>=14.0,<17",
    "httpx>=0.28.0,<1",
]

[project.optional-dependencies]
desktop = [
    "PySide6>=6.6.0",
    "pyinstaller>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.12.0",
]

[project.scripts]
voxel-forge = "voxel_forge.desktop.launch:main"
voxel-forge-mcp = "voxel_forge.server:main"
voxel-forge-bridge = "voxel_forge.bridge:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voxel_forge"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
