name: Readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      # Pin action identities, retaining the readiness baseline security policy.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install Python interpreters
        run: uv python install 3.11 3.14 pypy@3.12
      - name: Install Python dependencies
        run: uv sync --locked --python 3.11 --all-extras
      - name: Cache Nose detector
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/nose
          key: nose-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
      - name: Check Python formatting
        run: make check-fmt
      - name: Check Python lint
        run: make lint
      - name: Install editor dependencies
        run: bun install --frozen-lockfile --cwd editor
      - name: Test Python contracts
        run: make test
      - name: Build Python wheel
        run: uv build --wheel
      - name: Check editor formatting and lint
        run: make lint-editor
      - name: Check editor types
        run: make typecheck
      - name: Install editor test browser
        run: bunx playwright install --with-deps chromium
      - name: Test editor delivery
        run: make test-editor
      - name: Audit editor dependencies
        working-directory: editor
        run: bun audit
      - name: Check Markdown
        run: make markdownlint MDLINT="npx --yes markdownlint-cli2"

  # Roadmap step 1.3: prove the tool installs from a clean checkout with a
  # fresh dependency resolution (no lockfile), and that a headless run
  # binds no socket while still exporting a scene. This job fails if the
  # dependency bounds from task 1.1.1 regress.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install as a uv tool from a clean checkout
        run: uv tool install .
      - name: Verify the MCP entry point
        run: voxel-forge-mcp --help
      - name: Export a scene headless
        run: |
          uv run --no-project --with . python - << 'EOF'
          import pathlib
          import tempfile

          from voxel_forge import bridge, server

          server.voxelforge_create_scene("ci_smoke")
          server.voxelforge_fill_box(0, 3, 0, 1, 0, 2, "2")
          out = pathlib.Path(tempfile.mkdtemp()) / "ci_smoke.vox"
          server.voxelforge_export_vox(output_path=str(out))
          assert out.stat().st_size > 0, "the export must produce bytes"
          assert bridge.current_ports() is None, (
              "a headless run must not bind a port"
          )
          print("headless scene export OK")
          EOF
