name: Readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install Python interpreters
        run: uv python install 3.11 3.14 pypy@3.12
      - name: Install Python dependencies
        run: uv sync --locked --python 3.11 --all-extras
      - name: Cache Nose detector
        uses: actions/cache@v4
        with:
          path: .tools/nose
          key: nose-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
      - name: Check Python formatting
        run: make check-fmt
      - name: Check Python lint
        run: make lint
      - name: Test Python contracts
        run: make test
      - name: Build Python wheel
        run: uv build --wheel
      - name: Install editor dependencies
        run: npm ci --prefix editor
      - name: Check editor formatting and lint
        run: make lint-editor
      - name: Check editor types
        run: make typecheck
      - name: Build editor
        run: npm run build --prefix editor
      - name: Audit editor dependencies
        run: npm audit --prefix editor --audit-level=high
      - name: Check Markdown
        run: make markdownlint MDLINT="npx --yes markdownlint-cli2"
