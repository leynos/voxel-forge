name: Readiness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Python dependencies
        run: uv sync --locked --all-extras
      - name: Install editor dependencies
        run: bun install --frozen-lockfile --cwd editor
      - name: Check Python formatting
        run: make check-fmt
      - name: Check Python lint
        run: make lint
      - name: Test Python contracts
        run: make test
      - name: Build Python wheel
        run: uv build --wheel
      - name: Check editor formatting and lint
        run: make lint-editor
      - name: Check editor types
        run: make typecheck
      - name: Audit editor dependencies
        working-directory: editor
        run: bun audit
      - name: Check Markdown
        run: make markdownlint MDLINT="npx --yes markdownlint-cli2"
